# Frontend. Requiere el backend levantado (red repositorio-dev_default):
#   cd F:\IdeaProjects\repositorio-backend\docker-compose\dev
#   docker compose --profile services up -d --build
# Luego aqui:
#   docker compose up -d --build   ->  http://localhost:4200
name: repositorio-frontend

services:
  frontend:
    build: .
    image: repositorio-digital-frontend:latest
    ports:
      - "4200:80"
    networks:
      - backend

networks:
  backend:
    external: true
    name: repositorio-dev_default
