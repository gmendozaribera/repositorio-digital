server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno de Docker; permite arrancar aunque el backend aun no exista
  resolver 127.0.0.11 valid=10s;

  # Cabeceras comunes para todos los proxy_pass de este server
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  # Nginx es la puerta de entrada: REEMPLAZA X-Forwarded-For con la IP real del cliente. Con
  # $proxy_add_x_forwarded_for se conservaria lo que mande el cliente y podria falsear su IP para
  # saltarse el limite de intentos de login/registro (auth-service confia en esta cabecera).
  # Si algun dia hay otro proxy/balanceador delante de este nginx, usar el modulo realip en su lugar.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;

  # environment.ts usa apiUrl '/api/v1': Nginx reparte por prefijo entre los microservicios
  # (mismo reparto que proxy.conf.json en desarrollo). proxy_pass con variable y sin URI
  # reenvia la ruta completa, sin recortar /api/v1.
  location /api/v1/auth/ {
    set $auth_service http://auth-service:8081;
    proxy_pass $auth_service;
  }

  # user-service: usuarios, roles, padron estudiantil, parametros del sistema (dominios),
  # configuracion global (/config/smtp/prueba), notificaciones in-app y preferencias del perfil. Expresion regular para no capturar rutas de otros
  # servicios que empiecen igual (p. ej. /api/v1/usuarios-algo). Ojo: /api/v1/facultades/{id}/config
  # NO entra aqui (empieza por /facultades) y sigue yendo a catalog-service.
  location ~ ^/api/v1/(usuarios|tipos-usuario|padron|dominios|config|notificaciones|perfil)(/|$) {
    set $user_service http://user-service:8083;
    proxy_pass $user_service;
    # La importacion del padron acepta archivos de hasta 5 MB (default de Nginx: 1 MB).
    client_max_body_size 6m;
  }

  # work-service (Sprint 3): trabajos, revision, documentos (subida y descarga de archivos) y
  # repositorio de trabajos evaluados (/api/v1/repositorio, busqueda y ficha publica).
  location ~ ^/api/v1/(trabajos|documentos|repositorio)(/|$) {
    set $work_service http://work-service:8084;
    proxy_pass $work_service;
    # Archivos de hasta 100 MB (videos) + el resto del multipart. El backend vuelve a validar el
    # tamano real segun la facultad y la categoria.
    client_max_body_size 101m;
    # Streaming: Nginx pasa la subida a work-service a medida que llega (sin guardarla entera en
    # disco antes), asi la barra de progreso del navegador refleja la subida real.
    proxy_request_buffering off;
    # Subidas y descargas grandes con conexiones lentas: mas margen que los 60 s por defecto.
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    client_body_timeout 300s;
    send_timeout 300s;
  }

  # Resto de la API -> catalog-service.
  location /api/ {
    set $catalog_service http://catalog-service:8082;
    proxy_pass $catalog_service;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
