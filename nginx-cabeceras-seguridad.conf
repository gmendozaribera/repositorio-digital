# Cabeceras de seguridad para lo que sirve Nginx (index.html, JS, CSS, favicon).
# Se incluye en CADA location estatica de nginx.conf: en Nginx un add_header dentro de una
# location anula todos los del server, por eso no se declaran a nivel de server.
# Las respuestas de la API (location /api/...) NO las llevan: las pone el backend (Spring Security).
# "always" = tambien en respuestas de error (404, 500...).
#
# HSTS (Strict-Transport-Security) NO va aqui: este contenedor habla HTTP plano detras del
# Ingress. Lo agrega el Ingress que termina TLS (si se pusiera aqui y algun dia se sirve por
# HTTP o con otro dominio, el navegador quedaria "atado" a HTTPS por meses).

# CSP: el navegador solo ejecuta JS propio (sin scripts inline, sin eval, sin CDNs). Estilos
# inline permitidos porque Angular inyecta <style> de los componentes y [style.x] en runtime.
# img-src data: para el QR del 2FA (data URI). connect-src 'self': la API va por el mismo origen.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# No adivinar el tipo de un archivo (evita que un .txt se ejecute como script).
add_header X-Content-Type-Options "nosniff" always;

# No permitir que otro sitio meta la app en un iframe (clickjacking). Equivale a
# frame-ancestors 'none' para navegadores viejos.
add_header X-Frame-Options "DENY" always;

# Al salir hacia otro sitio solo se envia el origen (https://repositorio...), nunca la ruta.
# No se usa "no-referrer": con esa politica el navegador manda "Origin: null" en los POST al
# propio sitio y el filtro CORS del backend los rechaza (rompe el login).
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# La app no usa camara, microfono, ubicacion, pagos ni sensores: se bloquean para todos.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
